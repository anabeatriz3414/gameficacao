<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Gameficação</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="gamification-action-bar">
        <div class="gamification-action-container">
            <div class="gamification-welcome-info">
                <div class="gamification-logo-icon">G</div>
                <div class="gamification-text-group">
                    <h3>Bem-vindo à Jornada</h3>
                    <p>Crie sua conta para começar a acumular pontos e subir no ranking.</p>
                </div>
            </div>

            <div class="gamification-benefits-list">
                <div class="gamification-benefit-item"><i class="fas fa-check-circle"></i> Acesso Gratuito</div>
                <div class="gamification-benefit-item"><i class="fas fa-check-circle"></i> Ranking Global</div>
                <div class="gamification-benefit-item"><i class="fas fa-check-circle"></i> Medalhas de XP</div>
            </div>
        </div>
    </div>

    <main class="form-section">
        <div class="form-box">
            <header class="form-header">
                <h2>Nova Conta</h2>
                <p>Insira seus dados para prosseguir</p>
            </header>

            <form onsubmit="cadastrar(event)">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <div class="field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nome" placeholder="Como quer ser chamado?" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <div class="field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <div class="field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="senha" placeholder="Crie uma senha forte" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    FINALIZAR CADASTRO <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <footer class="form-footer">
                <p>Já tem uma conta? <a href="login.html">Entrar agora</a></p>
                <a href="index.html" class="btn-back">Voltar ao início</a>
            </footer>
        </div>
    </main>

    <script>
    function cadastrar(e){
        e.preventDefault();
        const user = {
            nome: document.getElementById("nome").value,
            email: document.getElementById("email").value
        };
        localStorage.setItem("user", JSON.stringify(user));
        alert("Conta criada com sucesso!");
        window.location.href = "login.html";
    }
    </script>
</body>
</html>
